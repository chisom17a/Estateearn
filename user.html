<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Estate Earn | Users</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f7fb;
    display:flex;
    min-height:100vh;
    transition: all .3s ease;
}

/* SIDEBAR */
.sidebar{
    width:250px;
    background:linear-gradient(to bottom,#2c5364,#1c1f2b);
    color:#fff;
    display:flex;
    flex-direction:column;
    padding:20px;
    transition: width .3s ease;
    position:relative;
}

.sidebar.collapsed{
    width:70px;
}

.sidebar .logo{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:30px;
}

.sidebar img{
    width:40px;
    transition: all .3s ease;
}

.sidebar.collapsed img{
    width:30px;
}

.sidebar h2{
    font-weight:600;
    transition: opacity .3s ease;
}

.sidebar.collapsed h2{
    opacity:0;
}

.sidebar .nav-btn{
    padding:14px;
    margin-bottom:10px;
    border-radius:8px;
    background:rgba(255,255,255,0.1);
    color:#fff;
    cursor:pointer;
    text-align:left;
    font-size:14px;
    transition:.3s;
    white-space: nowrap;
    overflow: hidden;
}

.sidebar.collapsed .nav-btn{
    text-align:center;
    font-size:18px;
}

.sidebar .nav-btn:hover{
    background:rgba(255,255,255,0.2);
}

/* MAIN CONTENT */
.main{
    flex:1;
    padding:25px;
    overflow-x:auto;
    transition: margin-left .3s ease;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

header .user{
    font-size:14px;
}

/* TOGGLE BUTTON */
#toggleBtn{
    position:absolute;
    top:20px;
    right:-25px;
    width:30px;
    height:30px;
    background:#2c5364;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    cursor:pointer;
    font-weight:600;
    box-shadow:0 0 8px rgba(0,0,0,.3);
    z-index:1000;
}

/* USERS TABLE */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th, td{
    padding:12px;
    border:1px solid #ddd;
    text-align:left;
}

th{
    background:#2c5364;
    color:#fff;
    font-weight:500;
}

/* POPUP */
.popup{
    position:fixed;
    top:20px;
    right:20px;
    background:#fff;
    width:300px;
    border-radius:12px;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
    padding:18px;
    display:flex;
    gap:10px;
    animation:slideIn .6s ease;
    z-index:999;
}

.popup .close{
    margin-left:auto;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
}

@keyframes slideIn{
    from{opacity:0;transform:translateX(40px);}
    to{opacity:1;transform:translateX(0);}
}

footer{
    text-align:center;
    padding:20px;
    font-size:13px;
    color:#777;
    margin-top:30px;
}
</style>
</head>
<body>

<!-- POPUP -->
<div class="popup" id="popup" style="display:none;">
    <div id="popupMessage"></div>
    <div class="close" onclick="closePopup()">×</div>
</div>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <div class="logo">
        <img src="owner.png" alt="Estate Earn">
        <h2>Admin</h2>
    </div>
    <div id="toggleBtn" onclick="toggleSidebar()">☰</div>
    <div class="nav-btn" onclick="go('chisom.html')">📊 Dashboard</div>
    <div class="nav-btn" onclick="go('user.html')">👥 Users</div>
    <div class="nav-btn" onclick="go('investments.html')">💼 Investments</div>
    <div class="nav-btn" onclick="go('referrals.html')">💸 Referrals</div>
    <div class="nav-btn" onclick="go('balance.html')">⚙️ Settings</div>
    <div class="nav-btn" onclick="logout()">🚪 Logout</div>
</div>

<!-- MAIN CONTENT -->
<div class="main">
<header>
    <h2>All Users</h2>
    <div class="user" id="helloUser"></div>
</header>

<div id="usersTableContainer"></div>

<footer>
© 2026 Estate Earn. All rights reserved.
</footer>
</div>

<script>
// Close popup
function closePopup(){
    document.getElementById("popup").style.display="none";
}

// Toggle sidebar
function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("collapsed");
}

// Redirect helper
function go(page){
    window.location.href = page;
}

// Check authentication & role
const currentUser = JSON.parse(localStorage.getItem("currentUser"));
if(!currentUser || currentUser.role !== "admin"){
    const popup = document.getElementById("popup");
    const message = document.getElementById("popupMessage");
    message.innerHTML = "<strong>Access Denied!</strong><br>Admin login required.";
    popup.style.display = "flex";
    setTimeout(()=>{
        window.location.href = "login.html";
    }, 3000);
} else {
    document.getElementById("helloUser").innerText = "Hello, " + currentUser.username;

    // Load users
    const users = JSON.parse(localStorage.getItem("estateUsers")) || [];
    if(users.length === 0){
        document.getElementById("usersTableContainer").innerHTML = "<p>No users found.</p>";
    } else {
        let html = '<table><tr><th>Username</th><th>Email</th><th>Phone</th><th>Role</th><th>Referral</th></tr>';
        users.forEach(u=>{
            html += `<tr>
                <td>${u.username}</td>
                <td>${u.email}</td>
                <td>${u.phone}</td>
                <td>${u.role}</td>
                <td>${u.referralCode || "-"}</td>
            </tr>`;
        });
        html += '</table>';
        document.getElementById("usersTableContainer").innerHTML = html;
    }
}

// Logout
function logout(){
    localStorage.removeItem("currentUser");
    window.location.href = "login.html";
}
</script>

</body>
</html>
