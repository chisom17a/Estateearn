<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Estate Earn | Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f4f7fb;
}

/* HEADER */
header{
    background:linear-gradient(to right,#1c1f2b,#2c5364);
    color:#fff;
    padding:16px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

header img{
    width:40px;
}

.user{
    font-size:14px;
}

/* CONTAINER */
.container{
    padding:25px;
}

/* STATS */
.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:#fff;
    border-radius:14px;
    padding:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.card h4{
    font-size:14px;
    color:#666;
}

.card h2{
    margin-top:10px;
    color:#1c1f2b;
}

/* ACTIONS */
.actions{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.action-btn{
    padding:14px;
    background:linear-gradient(to right,#2c5364,#1c1f2b);
    color:#fff;
    text-align:center;
    border-radius:12px;
    cursor:pointer;
    font-size:14px;
    transition:.3s;
}

.action-btn:hover{
    opacity:.9;
}

/* POPUP */
.popup{
    position:fixed;
    top:20px;
    right:20px;
    background:#fff;
    width:300px;
    border-radius:12px;
    box-shadow:0 15px 40px rgba(0,0,0,.2);
    padding:18px;
    display:flex;
    gap:10px;
    animation:slideIn .6s ease;
    z-index:999;
}

.popup .close{
    margin-left:auto;
    cursor:pointer;
    font-size:16px;
    font-weight:600;
}

@keyframes slideIn{
    from{opacity:0;transform:translateX(40px);}
    to{opacity:1;transform:translateX(0);}
}

footer{
    text-align:center;
    padding:20px;
    font-size:13px;
    color:#777;
}
</style>
</head>

<body>

<!-- POPUP -->
<div class="popup" id="popup" style="display:none;">
    <div id="popupMessage"></div>
    <div class="close" onclick="closePopup()">×</div>
</div>

<header>
    <div class="logo">
        <img src="owner.png">
        <h2>Estate Earn</h2>
    </div>
    <div class="user" id="helloUser"></div>
</header>

<div class="container">

<div class="stats">
    <div class="card">
        <h4>Total Balance</h4>
        <h2 id="balance">₦0.00</h2>
    </div>

    <div class="card">
        <h4>Total Investment</h4>
        <h2 id="investment">₦0.00</h2>
    </div>

    <div class="card">
        <h4>Daily Earnings</h4>
        <h2 id="earnings">₦0.00</h2>
    </div>

    <div class="card">
        <h4>Referral Bonus</h4>
        <h2 id="referral">₦0.00</h2>
    </div>
</div>

<div class="actions">
    
     <div class="action-btn" onclick="go('deposit.html')"> deposit</div>
    <div class="action-btn" onclick="go('invest.html')">💼 Invest Now</div>
    <div class="action-btn" onclick="go('withdraw.html')">💸 Withdraw</div>
    <div class="action-btn" onclick="go('referrals.html')">👥 Referrals</div>
    <div class="action-btn" onclick="go('free-cash.html')">🎁 Free Cash</div>
    <div class="action-btn" onclick="go('settings.html')">⚙️ Settings</div>
     <div class="action-btn" onclick="go('customerservice.html')"> support</div>
    <div class="action-btn" onclick="go('myplans.html')">my plans</div>
    <div class="action-btn" onclick="logout()">🚪 Sign Out</div>
</div>

</div>

<footer>
© 2026 Estate Earn. All rights reserved.
</footer>

<script>
// Close popup
function closePopup(){
    document.getElementById("popup").style.display="none";
}

// Redirect helper
function go(page){
    window.location.href = page;
}

// Check authentication
const currentUser = JSON.parse(localStorage.getItem("currentUser"));

if(!currentUser || currentUser.role !== "earner"){
    const popup = document.getElementById("popup");
    const message = document.getElementById("popupMessage");
    message.innerHTML = "<strong>Access Denied!</strong><br>Please login to access dashboard.";
    popup.style.display = "flex";
    setTimeout(()=>{
        window.location.href = "login.html";
    }, 3000);
} else {
    // Authenticated, load user info
    const username = currentUser.username || "User";
    document.getElementById("helloUser").innerText = "Hello, " + username;

    // Load balances from localStorage (or default 0)
    document.getElementById("balance").innerText =
        "₦" + (localStorage.getItem(currentUser.username + "_balance") || "0.00");
    document.getElementById("investment").innerText =
        "₦" + (localStorage.getItem(currentUser.username + "_investment") || "0.00");
    document.getElementById("earnings").innerText =
        "₦" + (localStorage.getItem(currentUser.username + "_dailyEarnings") || "0.00");
    document.getElementById("referral").innerText =
        "₦" + (localStorage.getItem(currentUser.username + "_referralBonus") || "0.00");
}

// Logout
function logout(){
    localStorage.removeItem("currentUser");
    window.location.href="login.html";
}
</script>

</body>
</html>
