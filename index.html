<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Estate Earn | Register</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}
body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}
.register-card{
    background:#fff;
    width:100%;
    max-width:420px;
    border-radius:16px;
    padding:30px 28px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}
.logo{text-align:center;margin-bottom:20px}
.logo img{width:90px}
.logo h2{margin-top:10px;color:#203a43}
.form-group{margin-bottom:15px}
.form-group label{font-size:13px}
.form-group input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
}
small{font-size:11px;color:#555}
.btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:linear-gradient(to right,#2c5364,#0f2027);
    color:#fff;
    cursor:pointer;
    margin-top:10px;
}
.footer-text{text-align:center;margin-top:18px;font-size:13px}
#successPopup{
    position:fixed;
    top:20px;
    right:20px;
    background:#2c5364;
    color:#fff;
    padding:15px 20px;
    border-radius:10px;
    display:none;
}
</style>
</head>

<body>

<div class="register-card">
    <div class="logo">
        <img src="owner.png">
        <h2>Estate Earn</h2>
    </div>

    <form id="registerForm">
        <div class="form-group">
            <label>Username</label>
            <input id="username" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input id="email" type="email" required>
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input id="phone" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input id="password" type="password" required>
            <small>Letters & numbers</small>
        </div>

        <div class="form-group">
            <label>Withdrawal Password</label>
            <input id="withdrawal" maxlength="6" required>
        </div>

        <div class="form-group">
            <label>Referral Code (Optional)</label>
            <input id="referral">
        </div>

        <button class="btn">Create Account</button>
    </form>

    <div class="footer-text">
        Already registered? <a href="login.html">Login</a>
    </div>
</div>

<div id="successPopup">Registration successful! Redirecting…</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  increment,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC-wOINz7Hz9r2aUXlUhfmPqwuxTGmkIK8",
  authDomain: "main-estateearn.firebaseapp.com",
  projectId: "main-estateearn",
  storageBucket: "main-estateearn.firebasestorage.app",
  messagingSenderId: "189305498914",
  appId: "1:189305498914:web:77fe6b137b2480e3f2c97b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Autofill referral
const params = new URLSearchParams(window.location.search);
if(params.get("ref")){
  document.getElementById("referral").value = params.get("ref");
}

document.getElementById("registerForm").addEventListener("submit", async e => {
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const password = document.getElementById("password").value;
  const withdrawal = document.getElementById("withdrawal").value;
  let referral = document.getElementById("referral").value.trim();

  if(referral && referral === username){
    alert("You cannot use your username as referral code");
    referral = "";
  }

  const userRef = doc(db, "users", username);
  const userSnap = await getDoc(userRef);
  if(userSnap.exists()){
    alert("Username already exists");
    return;
  }

  // Validate referral
  let validReferral = null;
  if(referral){
    const refRef = doc(db, "users", referral);
    const refSnap = await getDoc(refRef);
    if(refSnap.exists()){
      validReferral = referral;
      await updateDoc(refRef, {
        referralCount: increment(1)
      });
    }else{
      alert("Referral code not found. It has been removed.");
      referral = "";
    }
  }

  const referralBalance = 0;
  const depositBalance = 0;
  const earningBalance = 0;

  await setDoc(userRef, {
    username,
    email,
    phone,
    password,
    withdrawalPassword: withdrawal,
    referralCode: validReferral,
    referralCount: 0,
    welcomeBonusStatus: "pending",
    referralBalance,
    depositBalance,
    earningBalance,
    totalBalance: referralBalance + depositBalance + earningBalance,
    createdAt: serverTimestamp()
  });

  document.getElementById("successPopup").style.display = "block";
  setTimeout(() => window.location.href = "login.html", 3000);
});
</script>

</body>
</html>
