<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Estate Earn | Register</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}
body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

/* Registration Card */
.register-card{
    background:#de3;
    width:100%;
    max-width:420px;
    border-radius:16px;
    padding:30px 28px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    position:relative;
}

/* Logo */
.logo{text-align:center;margin-bottom:20px}
.logo img{width:90px}
.logo h2{margin-top:10px;color:#203a43}

/* Form */
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:13px;margin-bottom:6px}
.form-group input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
}
small{font-size:11px;color:#555}
.btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:linear-gradient(to right,#2c5364,#0f2027);
    color:#fff;
    cursor:pointer;
    margin-top:10px;
}
.footer-text{text-align:center;margin-top:18px;font-size:13px}
.footer-text a{text-decoration:none;color:#203a43;font-weight:500}

/* Notification Popup */
#successPopup{
    position:fixed;
    top:20px;
    right:20px;
    background:#2c5364;
    color:#fff;
    padding:15px 20px;
    border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
    display:none;
    font-size:14px;
    z-index:999;
}
</style>
</head>

<body>

<div class="register-card">
    <div class="logo">
        <img src="owner.png" alt="Estate Earn Logo">
        <h2>Estate Earn</h2>
    </div>

    <form id="registerForm">

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" required placeholder="Unique username">
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" required>
        </div>

        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required>
            <small>Must contain letters and numbers</small>
        </div>

        <div class="form-group">
            <label>Withdrawal Password</label>
            <input type="password" id="withdrawal" maxlength="6" required>
            <small>Exactly 6 digits</small>
        </div>

        <div class="form-group">
            <label>Referral Code (Optional)</label>
            <input type="text" id="referral">
        </div>

        <button class="btn">Create Account</button>
    </form>

    <div class="footer-text">
        Already have an account? <a href="login.html">Login</a>
    </div>
</div>

<!-- Success Notification -->
<div id="successPopup">Registration successful! Redirecting to login...</div>

<script>
// Load users
let users = JSON.parse(localStorage.getItem("estateUsers")) || [];

// Autofill referral from URL
const params = new URLSearchParams(window.location.search);
if(params.get("ref")){
    document.getElementById("referral").value = params.get("ref");
}

document.getElementById("registerForm").addEventListener("submit", function(e){
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value;
    const withdrawal = document.getElementById("withdrawal").value;
    let referral = document.getElementById("referral").value.trim();

    const alphaNum = /^(?=.*[A-Za-z])(?=.*\d)/;
    const sixDigits = /^[0-9]{6}$/;

    if(!alphaNum.test(password)){
        alert("Password must contain letters and numbers");
        return;
    }

    if(!sixDigits.test(withdrawal)){
        alert("Withdrawal password must be exactly 6 digits");
        return;
    }

    // Check duplicates
    const exists = users.find(u =>
        u.username === username ||
        u.email === email ||
        u.phone === phone
    );

    if(exists){
        alert("Username, email or phone number already exists");
        return;
    }

    // Referral validation
    if(referral){
        const refExists = users.find(u => u.referralCode === referral || u.username === referral);
        if(!refExists){
            const choice = confirm(
                "Referral code not found.\n\nOK = Generate free referral code\nCancel = Leave empty"
            );
            referral = choice ? "Hassan" : "";
        }
    }

    const newUser = {
        username,
        email,
        phone,
        password,
        withdrawalPassword: withdrawal,
        referralCode: referral || "Hassan",
        role: "earner",
        createdAt: new Date().toISOString()
    };

    users.push(newUser);
    localStorage.setItem("estateUsers", JSON.stringify(users));

    // Show notification
    const popup = document.getElementById("successPopup");
    popup.style.display = "block";

    // Redirect after 3 seconds
    setTimeout(() => {
        window.location.href = "login.html";
    }, 3000);
});
</script>

</body>
</html>
