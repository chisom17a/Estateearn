<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Estate Earn | Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1c1f2b,#2c5364);}
.login-card{background:#fe3;width:100%;max-width:400px;padding:30px;border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,.25);}
.logo{text-align:center;margin-bottom:25px;}
.logo img{width:85px;}
.logo h2{margin-top:10px;color:#2c5364;}
.form-group{margin-bottom:18px;}
.form-group label{display:block;font-size:13px;color:#444;margin-bottom:6px;}
.form-group input{width:100%;padding:12px;border-radius:8px;border:1px solid #ccc;font-size:14px;}
.btn{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(to right,#2c5364,#1c1f2b);color:#fff;cursor:pointer;font-size:15px;font-weight:500;}
.links{text-align:center;margin-top:15px;font-size:13px;}
.links a{color:#2c5364;text-decoration:none;font-weight:500;}
.loader{display:none;margin:15px auto;width:32px;height:32px;border:4px solid #ddd;border-top:4px solid #2c5364;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{100%{transform:rotate(360deg)}}
#loginPopup{position:fixed;top:20px;right:20px;background:#2c5364;color:#fff;padding:15px 20px;border-radius:10px;display:none;}
</style>
</head>
<body>

<div class="login-card">
    <div class="logo">
        <img src="owner.png" alt="Estate Earn Logo">
        <h2>Estate Earn</h2>
    </div>

    <form id="loginForm">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required placeholder="example@email.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" required placeholder="Enter your password">
        </div>

        <button type="submit" class="btn">Login</button>
        <div class="loader" id="loader"></div>
    </form>

    <div class="links">
        Don’t have an account? <a href="index.html">Register</a>
    </div>
</div>

<div id="loginPopup">Login successful! Redirecting...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

/* 🔥 Firebase Config */
const firebaseConfig = {
    apiKey: "AIzaSyC-wOINz7Hz9r2aUXlUhfmPqwuxTGmkIK8",
    authDomain: "main-estateearn.firebaseapp.com",
    projectId: "main-estateearn",
    storageBucket: "main-estateearn.firebasestorage.app",
    messagingSenderId: "189305498914",
    appId: "1:189305498914:web:77fe6b137b2480e3f2c97b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 🔗 Elements */
const emailEl = document.getElementById("email");
const passwordEl = document.getElementById("password");
const loader = document.getElementById("loader");
const popup = document.getElementById("loginPopup");

document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    loader.style.display = "block";

    const email = emailEl.value.trim();
    const password = passwordEl.value;

    try {
        // Firebase Auth login
        const userCred = await signInWithEmailAndPassword(auth, email, password);

        // Get user data from Firestore
        const q = query(collection(db, "users"), where("email", "==", email));
        const snap = await getDocs(q);

        if (snap.empty) throw new Error("User record not found in database");

        const userData = snap.docs[0].data();

        // Save user to localStorage
        localStorage.setItem("currentUser", JSON.stringify({
            uid: userCred.user.uid,
            email,
            username: userData.username,
            role: userData.role
        }));

        popup.style.display = "block";

        // Redirect based on role
        setTimeout(() => {
            if (userData.role === "admin") location.href = "chisom.html";
            else location.href = "dashboard.html";
        }, 1500);

    } catch (err) {
        alert(err.message || err);
    } finally {
        loader.style.display = "none";
    }
});
</script>

</body>
</html>
