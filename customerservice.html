<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Support Chat | Estate Earn</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:#f4f7fb;display:flex;flex-direction:column;min-height:100vh;}

/* HEADER */
header{padding:15px;background:linear-gradient(to right,#2c5364,#1c1f2b);color:#fff;display:flex;justify-content:space-between;align-items:center;}
header h2{font-weight:600;display:flex;align-items:center;gap:10px;}
header .notification{background:red;color:#fff;padding:4px 8px;border-radius:50%;font-size:12px;}
.back-btn{
    cursor:pointer;
    background:#fff;color:#2c5364;
    padding:4px 8px;border-radius:6px;
    font-weight:500;font-size:14px;
}
.back-btn:hover{opacity:0.8;}

/* CHAT WINDOW */
.chat-container{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width:600px;
    margin:20px auto;
    background:#fff;
    border-radius:10px;
    box-shadow:0 6px 18px rgba(0,0,0,.1);
    overflow:hidden;
}
.chat-messages{
    flex:1;
    padding:15px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    background:#f9f9f9;
}
.message{max-width:70%;padding:10px 15px;border-radius:12px;word-wrap:break-word;}
.message.user{background:#2c5364;color:#fff;align-self:flex-end;}
.message.admin{background:#e0e0e0;align-self:flex-start;color:#333;}

/* INPUT */
.chat-input{display:flex;border-top:1px solid #ccc;}
.chat-input input{flex:1;padding:12px;border:none;font-size:14px;}
.chat-input button{padding:12px 18px;background:linear-gradient(to right,#1c1f2b,#2c5364);color:#fff;border:none;cursor:pointer;}

/* FOOTER */
footer{text-align:center;padding:15px;font-size:13px;color:#777;margin-top:10px;}
</style>
</head>
<body>

<header>
    <h2>
        <span class="back-btn" onclick="goBack()">⬅ Back</span>
        Support Chat
    </h2>
    <div class="notification" id="notification" style="display:none;">0</div>
</header>

<div class="chat-container">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<footer>© 2026 Estate Earn. All rights reserved.</footer>

<script>
// Redirect back to dashboard
function goBack(){
    window.location.href="dashboard.html";
}

// User authentication
const currentUser = JSON.parse(localStorage.getItem("currentUser"));
if(!currentUser || currentUser.role!=="earner"){
    alert("Access Denied! Login as an earner.");
    window.location.href="login.html";
}

const chatMessages = document.getElementById("chatMessages");
const notificationEl = document.getElementById("notification");

// Load messages
function loadMessages(){
    const messages = JSON.parse(localStorage.getItem("supportMessages")) || [];
    const convo = messages.filter(m => m.user === currentUser.username);
    chatMessages.innerHTML="";
    let unreadCount=0;

    convo.forEach(m=>{
        const div = document.createElement("div");
        div.className="message "+(m.fromAdmin?"admin":"user");
        div.innerText=m.message;
        chatMessages.appendChild(div);

        // Count unread admin messages
        if(m.fromAdmin && !m.userRead){
            unreadCount++;
        }
    });

    chatMessages.scrollTop = chatMessages.scrollHeight;

    // Show notification if unread messages exist
    if(unreadCount>0){
        notificationEl.style.display="inline-block";
        notificationEl.innerText=unreadCount;
    }else{
        notificationEl.style.display="none";
    }

    // Mark all admin messages as read
    const messagesStorage = JSON.parse(localStorage.getItem("supportMessages")) || [];
    messagesStorage.forEach(m=>{
        if(m.user===currentUser.username && m.fromAdmin){
            m.userRead=true;
        }
    });
    localStorage.setItem("supportMessages", JSON.stringify(messagesStorage));
}

// Send user message
function sendMessage(){
    const input = document.getElementById("chatInput");
    const msg = input.value.trim();
    if(msg==="") return;

    const messages = JSON.parse(localStorage.getItem("supportMessages")) || [];
    messages.push({
        user:currentUser.username,
        message:msg,
        date:new Date().toLocaleString(),
        fromAdmin:false,
        adminRead:false,
        userRead:true
    });
    localStorage.setItem("supportMessages", JSON.stringify(messages));
    input.value="";
    loadMessages();
}

// Poll for new admin messages every 3 seconds
setInterval(loadMessages,3000);

// Initial load
loadMessages();
</script>
</body>
</html>
